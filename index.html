<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS RACING - Sistema de Gestión de Motomecánica</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. VARIABLES Y RESETEO GENERAL
           ========================================= */
        :root {
            --primary: #e52421;
            --primary-hover: #ff3935;
            --primary-dark: #b91512;
            --bg-dark: #070809;
            --bg-panel: #111417;
            --bg-input: #0b0d10;
            --text-main: #ffffff;
            --text-muted: #9299a5;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #31d17c;
            --warning: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Fondo con textura sutil */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        /* =========================================
           2. BARRA DE NAVEGACIÓN
           ========================================= */
        header {
            background: rgba(7, 8, 9, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-subtitle {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: -5px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 15px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* =========================================
           3. ESTRUCTURA PRINCIPAL Y PANELES
           ========================================= */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel-container {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Sistema de Pestañas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(229, 36, 33, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* =========================================
           4. FORMULARIOS Y BOTONES
           ========================================= */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 25px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* =========================================
           5. TABLAS Y LISTADOS (PANEL ADMINISTRADOR)
           ========================================= */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-pendiente { background: rgba(243, 156, 18, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .status-completado { background: rgba(49, 209, 124, 0.2); color: var(--success); border: 1px solid var(--success); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            MAS <span>RACING</span>
            <span class="logo-subtitle">SISTEMA DE MOTOMECÁNICA</span>
        </a>
        <nav>
            <a href="#"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="#"><i class="fa-brands fa-whatsapp"></i> Contacto</a>
        </nav>
    </header>

    <div class="container">
        <div class="panel-container">
            
            <!-- NAVEGACIÓN PRINCIPAL DEL SISTEMA -->
            <div class="tabs">
                <button class="tab-btn active" onclick="cambiarPestana('panel-cliente', this)">
                    <i class="fa-solid fa-user"></i> Acceso Clientes
                </button>
                <button class="tab-btn" onclick="cambiarPestana('panel-taller', this)">
                    <i class="fa-solid fa-wrench"></i> Administración Taller
                </button>
            </div>

            <!-- =========================================
                 MÓDULO 1: PORTAL DEL CLIENTE
                 ========================================= -->
            <div id="panel-cliente" class="tab-content active">
                <h2 style="margin-bottom: 20px; font-family: 'Barlow Condensed'; font-size: 30px;">PORTAL DE CLIENTES</h2>
                
                <div class="form-grid">
                    <!-- Registro de nuevo cliente -->
                    <div style="background: rgba(255,255,255,0.02); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h3 style="margin-bottom: 15px; color: var(--primary);">1. Registrarse</h3>
                        <div class="form-group">
                            <label>DNI</label>
                            <input type="number" id="cliDni" placeholder="Tu DNI sin puntos">
                        </div>
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" id="cliNombre" placeholder="Ej: Lucas Martínez">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="number" id="cliTel" placeholder="WhatsApp">
                        </div>
                        <button class="btn-primary" onclick="registrarCliente()">Registrar Mis Datos</button>
                    </div>

                    <!-- Solicitud de Turno -->
                    <div style="background: rgba(255,255,255,0.02); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <h3 style="margin-bottom: 15px; color: var(--primary);">2. Solicitar Turno</h3>
                        <div class="form-group">
                            <label>Tu DNI (Ya registrado)</label>
                            <input type="number" id="turnoDni" placeholder="Ingresá tu DNI">
                        </div>
                        <div class="form-group">
                            <label>Moto (Marca, Modelo y Año)</label>
                            <input type="text" id="turnoMoto" placeholder="Ej: Honda Tornado 250 - 2021">
                        </div>
                        <div class="form-group">
                            <label>Servicio Requerido</label>
                            <select id="turnoServicio">
                                <option value="Service Completo">Service Completo</option>
                                <option value="Cambio de Aceite">Cambio de Aceite y Filtros</option>
                                <option value="Frenos y Transmisión">Revisión de Frenos y Transmisión</option>
                                <option value="Problema Eléctrico">Problema Eléctrico</option>
                            </select>
                        </div>
                        <button class="btn-primary" onclick="solicitarTurno()">Agendar y Avisar por WhatsApp</button>
                    </div>
                </div>
            </div>

            <!-- =========================================
                 MÓDULO 2: ADMINISTRACIÓN DEL TALLER
                 ========================================= -->
            <div id="panel-taller" class="tab-content">
                <!-- Login del Taller -->
                <div id="login-taller" style="max-width: 400px; margin: 0 auto; text-align: center;">
                    <h2 style="margin-bottom: 20px; font-family: 'Barlow Condensed'; font-size: 30px;">ACCESO TALLER</h2>
                    <div class="form-group">
                        <label>Contraseña Maestra</label>
                        <input type="password" id="passTaller" placeholder="Ingresá la clave">
                    </div>
                    <button class="btn-primary" onclick="accederTaller()">Ingresar al Sistema</button>
                </div>

                <!-- Panel de Control del Taller (Oculto por defecto) -->
                <div id="dashboard-taller" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                        <h2 style="font-family: 'Barlow Condensed'; font-size: 30px; color: var(--primary);">ÓRDENES DE TRABAJO Y TURNOS</h2>
                        <button class="btn-secondary" onclick="cerrarSesionTaller()">Cerrar Sesión</button>
                    </div>

                    <div style="overflow-x: auto;">
                        <table id="tablaTurnos">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th>Contacto</th>
                                    <th>Moto</th>
                                    <th>Servicio</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="listaTrabajos">
                                <!-- Los turnos se cargarán acá mediante JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        /* =========================================
           LÓGICA DEL SISTEMA (JAVASCRIPT)
           ========================================= */

        // 1. NAVEGACIÓN DE PESTAÑAS
        function cambiarPestana(idPestana, boton) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(idPestana).classList.add('active');
            boton.classList.add('active');
        }

        // 2. BASE DE DATOS LOCAL (Simulación usando LocalStorage)
        function obtenerDatos(key) {
            return JSON.parse(localStorage.getItem(key)) || [];
        }

        function guardarDatos(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        // 3. REGISTRO DE CLIENTES
        function registrarCliente() {
            const dni = document.getElementById('cliDni').value;
            const nombre = document.getElementById('cliNombre').value;
            const tel = document.getElementById('cliTel').value;

            if(!dni || !nombre || !tel) {
                alert("Por favor, completá todos los campos.");
                return;
            }

            let clientes = obtenerDatos('mas_racing_clientes');
            
            // Verificar si el cliente ya existe
            if(clientes.find(c => c.dni === dni)) {
                alert("Este DNI ya está registrado en el sistema.");
                return;
            }

            clientes.push({ dni, nombre, tel, fechaRegistro: new Date().toLocaleDateString() });
            guardarDatos('mas_racing_clientes', clientes);
            
            alert("¡Cliente registrado con éxito! Ya podés solicitar turno.");
            
            // Autocompletar el campo de DNI en el turno
            document.getElementById('turnoDni').value = dni;
            
            // Limpiar formulario
            document.getElementById('cliDni').value = '';
            document.getElementById('cliNombre').value = '';
            document.getElementById('cliTel').value = '';
        }

        // 4. SOLICITUD DE TURNO (Y envío a WhatsApp)
        function solicitarTurno() {
            const dni = document.getElementById('turnoDni').value;
            const moto = document.getElementById('turnoMoto').value;
            const servicio = document.getElementById('turnoServicio').value;

            if(!dni || !moto) {
                alert("Completá tu DNI y los datos de tu moto.");
                return;
            }

            let clientes = obtenerDatos('mas_racing_clientes');
            let cliente = clientes.find(c => c.dni === dni);

            if(!cliente) {
                alert("El DNI ingresado no está registrado. Por favor, registrate primero.");
                return;
            }

            let turnos = obtenerDatos('mas_racing_turnos');
            const nuevoTurno = {
                id: Date.now(),
                dni: cliente.dni,
                nombre: cliente.nombre,
                tel: cliente.tel,
                moto: moto,
                servicio: servicio,
                fecha: new Date().toLocaleDateString(),
                estado: 'Pendiente' // Puede ser Pendiente o Completado
            };

            turnos.push(nuevoTurno);
            guardarDatos('mas_racing_turnos', turnos);
            cargarTablaTaller(); // Actualiza la tabla del admin

            // Crear mensaje de WhatsApp automático
            const msj = `Hola MAS RACING! Solicito un turno.%0A%0A*Cliente:* ${cliente.nombre}%0A*Moto:* ${moto}%0A*Servicio:* ${servicio}`;
            const numeroTaller = "5493425688013"; // <-- PONER EL NÚMERO DEL TALLER ACÁ
            
            alert("¡Turno agendado internamente! Ahora se abrirá WhatsApp para confirmarlo con el taller.");
            window.open(`https://api.whatsapp.com/send?phone=${numeroTaller}&text=${msj}`, '_blank');

            // Limpiar campos
            document.getElementById('turnoMoto').value = '';
        }

        // 5. ACCESO Y PANEL DE ADMINISTRACIÓN DEL TALLER
        function accederTaller() {
            const clave = document.getElementById('passTaller').value;
            
            // Clave por defecto para entrar al panel del mecánico
            if(clave === "masracing2026") {
                document.getElementById('login-taller').style.display = 'none';
                document.getElementById('dashboard-taller').style.display = 'block';
                cargarTablaTaller();
            } else {
                alert("Contraseña incorrecta. Acceso denegado.");
            }
        }

        function cerrarSesionTaller() {
            document.getElementById('dashboard-taller').style.display = 'none';
            document.getElementById('login-taller').style.display = 'block';
            document.getElementById('passTaller').value = '';
        }

        // 6. RENDERIZAR TABLA DE ÓRDENES DE TRABAJO
        function cargarTablaTaller() {
            const turnos = obtenerDatos('mas_racing_turnos');
            const tbody = document.getElementById('listaTrabajos');
            tbody.innerHTML = '';

            if(turnos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No hay turnos registrados aún.</td></tr>`;
                return;
            }

            // Invertir para ver los más nuevos primero
            turnos.reverse().forEach(turno => {
                const badgeClass = turno.estado === 'Completado' ? 'status-completado' : 'status-pendiente';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${turno.fecha}</td>
                        <td><strong>${turno.nombre}</strong><br><small>DNI: ${turno.dni}</small></td>
                        <td>${turno.tel}</td>
                        <td>${turno.moto}</td>
                        <td>${turno.servicio}</td>
                        <td><span class="status-badge ${badgeClass}">${turno.estado}</span></td>
                        <td>
                            ${turno.estado === 'Pendiente' ? 
                              `<button class="btn-secondary" onclick="marcarCompletado(${turno.id})" style="border-color: var(--success); color: var(--success); font-size: 11px;">✔ Finalizar</button>` 
                              : `<button class="btn-secondary" onclick="eliminarTurno(${turno.id})" style="border-color: var(--primary); color: var(--primary); font-size: 11px;">🗑 Borrar</button>`}
                        </td>
                    </tr>
                `;
            });
        }

        // 7. ACCIONES DEL MECÁNICO (Finalizar Trabajo o Eliminar)
        function marcarCompletado(id) {
            let turnos = obtenerDatos('mas_racing_turnos');
            let index = turnos.findIndex(t => t.id === id);
            
            if(index !== -1) {
                turnos[index].estado = 'Completado';
                guardarDatos('mas_racing_turnos', turnos);
                cargarTablaTaller();
            }
        }

        function eliminarTurno(id) {
            if(confirm("¿Estás seguro de eliminar este registro del historial?")) {
                let turnos = obtenerDatos('mas_racing_turnos');
                turnos = turnos.filter(t => t.id !== id);
                guardarDatos('mas_racing_turnos', turnos);
                cargarTablaTaller();
            }
        }

    </script>
</body>
</html>
