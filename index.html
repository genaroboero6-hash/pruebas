<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brussy Barbería</title>
    <!-- Tailwind CSS para diseño rápido y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="p-4 bg-gray-800 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wider text-amber-500">BRUSSY BARBERÍA</h1>
        <div id="auth-status" class="text-sm"></div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center">

        <!-- 1. SECCIÓN DE AUTENTICACIÓN (Login / Registro separados) -->
        <section id="auth-section" class="bg-gray-800 p-6 rounded-xl shadow-lg space-y-4">
            <div class="flex border-b border-gray-700 pb-2 mb-4">
                <button id="tab-login" onclick="switchAuthMode('login')" class="flex-1 text-center font-bold text-amber-500 border-b-2 border-amber-500 pb-1">Iniciar Sesión</button>
                <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 text-center font-medium text-gray-400 pb-1">Registrarse</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold p-2 rounded transition">Ingresar</button>
            </form>
            <p id="auth-error" class="text-red-400 text-xs text-center mt-2"></p>
        </section>

        <!-- 2. VISTA DE CLIENTE (Reserva de turnos) -->
        <section id="client-view" class="hidden bg-gray-800 p-6 rounded-xl shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-amber-400">Reservar Turno</h2>
            <form onsubmit="bookAppointment(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Seleccionar Fecha y Hora</label>
                    <input type="datetime-local" id="appointment-time" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 font-bold p-2 rounded transition">Confirmar Turno</button>
            </form>
            <button onclick="logout()" class="w-full text-xs text-gray-400 hover:text-white mt-4">Cerrar Sesión</button>
        </section>

        <!-- 3. VISTA DE BARBERO (Gestión y bloqueo de horarios/días) -->
        <section id="barber-view" class="hidden bg-gray-800 p-6 rounded-xl shadow-lg space-y-4">
            <h2 class="text-lg font-bold text-amber-400">Panel del Barbero</h2>
            
            <div class="border-t border-gray-700 pt-3 space-y-3">
                <h3 class="text-sm font-semibold text-gray-300">Bloquear Horario o Día Completo</h3>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Bloquear Fecha/Hora Específica o Día Entero</label>
                    <input type="date" id="block-date" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white mb-2">
                    <input type="time" id="block-time" class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white mb-2" placeholder="Dejar vacío para bloquear el día entero">
                </div>
                <button onclick="blockSchedule()" class="w-full bg-red-600 hover:bg-red-700 font-bold p-2 rounded transition text-sm">Bloquear para Clientes</button>
            </div>

            <button onclick="logout()" class="w-full text-xs text-gray-400 hover:text-white mt-4">Cerrar Sesión</button>
        </section>

    </main>

    <!-- Script de lógica y Supabase -->
    <script>
        // Configura tus credenciales de Supabase aquí
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'login'; // 'login' o 'signup'

        function switchAuthMode(mode) {
            currentMode = mode;
            const btnLogin = document.getElementById('tab-login');
            const btnSignup = document.getElementById('tab-signup');
            const authBtn = document.getElementById('auth-btn');

            if (mode === 'login') {
                btnLogin.className = "flex-1 text-center font-bold text-amber-500 border-b-2 border-amber-500 pb-1";
                btnSignup.className = "flex-1 text-center font-medium text-gray-400 pb-1";
                authBtn.innerText = "Ingresar";
            } else {
                btnSignup.className = "flex-1 text-center font-bold text-amber-500 border-b-2 border-amber-500 pb-1";
                btnLogin.className = "flex-1 text-center font-medium text-gray-400 pb-1";
                authBtn.innerText = "Registrarse";
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.innerText = '';

            let response;
            if (currentMode === 'login') {
                response = await supabaseClient.auth.signInWithPassword({ email, password });
            } else {
                response = await supabaseClient.auth.signUp({ email, password });
            }

            if (response.error) {
                errorEl.innerText = response.error.message;
            } else {
                checkUserSession();
            }
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authSection = document.getElementById('auth-section');
            const clientView = document.getElementById('client-view');
            const barberView = document.getElementById('barber-view');

            if (session) {
                authSection.classList.add('hidden');
                
                // Definir si es barbero por email (ejemplo: bruno@barber.com o contraseña maestra)
                const userEmail = session.user.email;
                if (userEmail === 'BrunoBarber2026@gmail.com' || userEmail.includes('barber')) {
                    barberView.classList.remove('hidden');
                } else {
                    clientView.classList.remove('hidden');
                }
            } else {
                authSection.classList.remove('hidden');
                clientView.classList.add('hidden');
                barberView.classList.add('hidden');
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkUserSession();
        }

        async function bookAppointment(e) {
            e.preventDefault();
            const time = document.getElementById('appointment-time').value;
            // Aquí guardas el turno en tu tabla de Supabase ('appointments')
            alert('Turno solicitado con éxito para: ' + time);
        }

        async function blockSchedule() {
            const date = document.getElementById('block-date').value;
            const time = document.getElementById('block-time').value;

            if (!date) {
                alert('Selecciona al menos una fecha.');
                return;
            }

            // Aquí guardas el bloqueo en tu tabla de Supabase ('blocked_slots')
            // para que luego la vista de clientes filtre y no muestre este horario o día.
            alert(`Bloqueo aplicado correctamente para la fecha: ${date} ${time ? 'a las ' + time : '(Día entero)'}`);
        }

        // Verificar sesión al cargar
        checkUserSession();
    </script>
</body>
</html>
